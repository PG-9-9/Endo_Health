name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set_image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/endo-health:latest

      - name: Set image name output
        id: set_image
        run: |
          echo "image=${{ secrets.DOCKERHUB_USERNAME }}/endo-health:latest" >> $GITHUB_OUTPUT

  deploy-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Wait a bit for image availability
        run: sleep 10

      - name: Check deploy secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "EC2 deploy secrets not set; skipping deploy job."
            exit 0
          fi
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "DOCKERHUB_USERNAME secret not set; cannot determine image name. Set DOCKERHUB_USERNAME in repo secrets."
            exit 1
          fi

      - name: Create SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Debug print resolved image name
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          echo "Resolved IMAGE for deploy: '$IMAGE'"

      - name: Deploy to EC2 (pull & run with cleanup)
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key $EC2_USER@$EC2_HOST << EOF
            set -euo pipefail
            echo "Deploying image: $IMAGE"
            # cleanup containers/images to free space
            if [ "$(docker ps -aq)" != "" ]; then
              docker ps -aq | xargs -r docker rm -f || true
            fi
            if [ "$(docker images -q)" != "" ]; then
              docker images -q | xargs -r docker rmi -f || true
            fi
            docker system prune -a --volumes -f || true
            # pull and run
            docker pull "$IMAGE" || exit 1
            docker stop endo_health || true
            docker rm endo_health || true
            docker run -d --restart unless-stopped -p 80:8501 \
              --name endo_health "$IMAGE"
          EOF
