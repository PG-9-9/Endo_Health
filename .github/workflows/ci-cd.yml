name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_short: ${{ steps.set_image.outputs.image_short }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/endo-health:latest

      - name: Set short image output
        id: set_image
        run: |
          # Use short non-secret image identifier so GitHub won't treat it as secret
          echo "image_short=endo-health:latest" >> $GITHUB_OUTPUT

  deploy-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Wait a bit for image availability
        run: sleep 10

      - name: Check deploy secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "EC2 deploy secrets not set; skipping deploy job."
            exit 0
          fi

      - name: Create SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Debug print short image name
        env:
          IMAGE_SHORT: ${{ needs.build-and-push.outputs.image_short }}
        run: |
          echo "Resolved IMAGE_SHORT for deploy: '$IMAGE_SHORT'"

      - name: Construct full image name on runner
        id: construct_image
        env:
          IMAGE_SHORT: ${{ needs.build-and-push.outputs.image_short }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # Do not print DOCKERHUB_USERNAME or the full image to logs (it may be considered sensitive)
          IMAGE_FULL="docker.io/${DOCKERHUB_USERNAME}/${IMAGE_SHORT}"
          echo "IMAGE_FULL=$IMAGE_FULL" >> $GITHUB_ENV

      - name: Deploy to EC2 (pull & run with cleanup)
        env:
          IMAGE_FULL: ${{ env.IMAGE_FULL }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key $EC2_USER@$EC2_HOST << EOF
            set -euo pipefail
            # IMAGE_FULL is expanded on the runner and inserted here; do not echo it to logs
            echo "Deploying container from short tag (pulling remote image)"
            # cleanup containers/images to free space
            if [ "$(docker ps -aq)" != "" ]; then
              docker ps -aq | xargs -r docker rm -f || true
            fi
            if [ "$(docker images -q)" != "" ]; then
              docker images -q | xargs -r docker rmi -f || true
            fi
            docker system prune -a --volumes -f || true
            # pull and run
            docker pull "$IMAGE_FULL" || exit 1
            docker stop endo_health || true
            docker rm endo_health || true
            docker run -d --restart unless-stopped -p 80:8501 \
              --name endo_health "$IMAGE_FULL"
          EOF
